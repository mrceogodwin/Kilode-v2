<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1a1d24" />
    <title>Kilode</title>
    <style>
      html, body { margin: 0; min-height: 100%; background: #1a1d24; color: #f7f4ee; font-family: "Plus Jakarta Sans", ui-sans-serif, system-ui, sans-serif; }
      main { min-height: 100dvh; display: grid; place-items: center; text-align: center; padding: 28px; }
      .spin { width: 36px; height: 36px; margin: 0 auto 14px; border-radius: 999px; border: 3px solid rgba(255,255,255,.22); border-top-color: #fff; animation: spin .8s linear infinite; }
      h1 { margin: 0; font-size: 28px; letter-spacing: -0.03em; }
      p { margin: 8px 0 0; font-size: 13px; color: rgba(247,244,238,.72); }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <main>
      <div>
        <div class="spin" aria-hidden="true"></div>
        <h1>Kilode!</h1>
        <p>You are currently offline. Showing the saved app.</p>
      </div>
    </main>
  </body>
</html>
