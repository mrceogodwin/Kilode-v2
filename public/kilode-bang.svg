<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bang" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9fd0aa"/>
      <stop offset="48%" stop-color="#6b9e78"/>
      <stop offset="100%" stop-color="#3d6a48"/>
    </linearGradient>
    <linearGradient id="shine" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="42%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Bang-only mark: no dark glass plate -->
  <g transform="translate(256 248)">
    <g transform="rotate(-12)">
      <rect x="-44" y="-168" width="88" height="250" rx="40" fill="url(#bang)"/>
      <rect x="-44" y="-168" width="88" height="250" rx="40" fill="url(#shine)"/>
    </g>
  </g>
  <circle cx="292" cy="392" r="44" fill="url(#bang)"/>
  <circle cx="278" cy="376" r="15" fill="#ffffff" fill-opacity="0.32"/>
