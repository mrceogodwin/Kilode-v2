<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bang" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#f2f4f1"/>
      <stop offset="100%" stop-color="#e2e6e0"/>
    </linearGradient>
    <linearGradient id="shine" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="dot" cx="35%" cy="32%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#f0f2ef"/>
      <stop offset="100%" stop-color="#dfe3dc"/>
    </radialGradient>
  </defs>
  <!-- Glossy white/off-white bang on transparent — Create-a-post green plate provides contrast -->
  <g transform="translate(256 248)">
    <g transform="rotate(-12)">
      <rect x="-44" y="-168" width="88" height="250" rx="40" fill="url(#bang)"/>
      <rect x="-44" y="-168" width="88" height="250" rx="40" fill="url(#shine)"/>
    </g>
  </g>
  <circle cx="292" cy="392" r="44" fill="url(#dot)"/>
  <circle cx="278" cy="376" r="15" fill="#ffffff" fill-opacity="0.55"/>
</svg>
